name: Daily Regulatory Update

on:
  schedule:
    # Spustí sa každú noc o 04:00 ráno
    - cron: '0 4 * * *'
  workflow_dispatch: # Umožní ti spustiť to ručne cez web GitHubu

jobs:
  update_data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Pipeline
      run: python runner.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/regalert_data.sqlite
        git commit -m "Auto-update: Latest Regulatory Data [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
        git push